
spring:
  application:
    name: fuel-tax-calculator

  datasource:
    url: jdbc:postgresql://localhost:5432/fuel_tax_db
    username: fuel_app
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    com.jobbersoft.fuel_tax_calculator: INFO
    org.flywaydb: INFO
